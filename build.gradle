plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
}

// each versions/<mc> project = shared src/ + its own Compat + the glfw or sdl window code
subprojects {
    apply plugin: 'java'
    apply plugin: 'net.fabricmc.fabric-loom'

    def mc = project.name
    def windowSrc = rootProject.file("platform/${project.window_platform}")

    version = "${rootProject.mod_version}+${mc}"
    group = rootProject.maven_group

    base {
        archivesName = rootProject.archives_base_name
    }

    repositories {
        maven { url = "https://maven.fabricmc.net/" }
        mavenCentral()
    }

    // 26.x is unobfuscated, no mappings needed
    dependencies {
        minecraft "com.mojang:minecraft:${project.minecraft_version}"
        implementation "net.fabricmc:fabric-loader:${rootProject.loader_version}"
        implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

        testImplementation platform("org.junit:junit-bom:5.12.2")
        testImplementation "org.junit.jupiter:junit-jupiter"
        testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    }

    sourceSets {
        main {
            java.srcDirs = [rootProject.file('src/main/java'), new File(windowSrc, 'src/main/java'), 'src/main/java']
            resources.srcDirs = [rootProject.file('src/main/resources')]
        }
        test {
            java.srcDirs = [rootProject.file('src/test/java')]
        }
    }

    // ./gradlew :26.3:runClientGameTest, screenshots end up in versions/<mc>/build/run/clientGameTest/screenshots
    fabricApi {
        configureTests {
            createSourceSet = true
            modId = "speedrunport-gametest"
            enableGameTests = false
            enableClientGameTests = true
        }
    }

    sourceSets.gametest {
        java.srcDirs = [rootProject.file('src/gametest/java'), new File(windowSrc, 'src/gametest/java'), 'src/gametest/java']
        resources.srcDirs = [rootProject.file('src/gametest/resources')]
    }

    test {
        useJUnitPlatform()
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
        withSourcesJar()
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 25
    }

    tasks.named('compileJava') {
        options.compilerArgs << '-Xlint:deprecation'
    }

    processResources {
        def props = [version: project.version, minecraft_dependency: project.minecraft_dependency]
        inputs.properties props
        filesMatching("fabric.mod.json") {
            expand props
        }
    }

    // -PextraMods="sodium.jar;lithium.jar" to test with other mods loaded
    tasks.matching { it.name in ['runClient', 'runClientGameTest'] }.configureEach {
        if (project.hasProperty('extraMods')) {
            jvmArgs "-Dfabric.addMods=${project.extraMods}"
        }
    }
}

// copies every version's jar to build/libs
tasks.register('collectJars', Copy) {
    dependsOn subprojects.collect { "${it.path}:jar" }
    from(subprojects.collect { it.layout.buildDirectory.dir('libs') }) {
        exclude '*-sources.jar'
    }
    into layout.buildDirectory.dir('libs')
}
