plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'java'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url = "https://maven.fabricmc.net/" }
    mavenCentral()
}

dependencies {
    // 26.x ships unobfuscated, so there is no mappings line: the code uses Mojang's own names.
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    testImplementation platform("org.junit:junit-bom:5.12.2")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
    useJUnitPlatform()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.named('compileJava') {
    options.compilerArgs << '-Xlint:deprecation'
}

// Real-client tests: `./gradlew runClientGameTest` opens the game, makes a test world, presses the
// F3 combos and saves screenshots to build/run/clientGameTest/screenshots. Not part of `build`.
fabricApi {
    configureTests {
        createSourceSet = true
        modId = "speedrunport-gametest"
        enableGameTests = false
        enableClientGameTests = true
    }
}

// Optional: -PextraMods="a.jar;b.jar" also loads those mod jars (e.g. Sodium) into runClient and
// runClientGameTest, to check SpeedrunPort alongside them.
tasks.matching { it.name in ['runClient', 'runClientGameTest'] }.configureEach {
    if (project.hasProperty('extraMods')) {
        jvmArgs "-Dfabric.addMods=${project.extraMods}"
    }
}
